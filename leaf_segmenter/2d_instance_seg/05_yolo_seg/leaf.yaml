# Ultralytics dataset template for leaf instance segmentation.
# Fill in paths to your dataset (YOLO-seg polygon label format) and edit names.
#
# Directory layout Ultralytics expects:
#   <path>/images/train/*.jpg   <path>/labels/train/*.txt
#   <path>/images/val/*.jpg     <path>/labels/val/*.txt
# Each label .txt line: <class_id> x1 y1 x2 y2 ... xn yn   (normalized polygon)

path: /absolute/path/to/your/leaf_dataset
train: images/train
val: images/val

names:
  0: leaf
# add more classes if your dataset distinguishes them, e.g.
#   1: branch
